name: Android core

# Builds puae_libretro_android.so for the Fire TV (32-bit RetroArch: armeabi-v7a, with JIT).
# Pushes build only armeabi-v7a, as fast as possible (ccache, newer push cancels older run).
# arm64-v8a too on tags or by hand (Run workflow -> all_abis).
# Artifacts are named like the libretro buildbot files, so RetroArch's Core Downloader can
# install them from a custom buildbot URL.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      all_abis:
        description: "Also build arm64-v8a"
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: ${{ fromJSON((startsWith(github.ref, 'refs/tags/v') || inputs.all_abis) && '["armeabi-v7a","arm64-v8a"]' || '["armeabi-v7a"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.abi }}
          max-size: 500M

      - name: Generate ARM JIT tables
        if: matrix.abi == 'armeabi-v7a'
        run: sh .github/scripts/gen-arm-jit.sh

      - name: Build with ndk-build
        working-directory: jni
        run: |
          "$ANDROID_NDK_LATEST_HOME/ndk-build" -k -j"$(nproc)" \
            APP_ABI=${{ matrix.abi }} APP_PLATFORM=android-21 NDK_CCACHE=ccache APP_CFLAGS="-w -ferror-limit=0 -O3 -mtune=cortex-a55"

      - name: Build JIT test runner (headless libretro frontend, run with adb shell)
        if: matrix.abi == 'armeabi-v7a'
        run: |
          mkdir -p out
          "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang"             -O2 -w -Ilibretro-common/include .github/scripts/jit-runner.c -ldl -o out/jit-runner
          # NDK profiler, to profile the core on the Fire TV with the runner
          cp "$ANDROID_NDK_LATEST_HOME/simpleperf/bin/android/arm/simpleperf" out/simpleperf

      - name: Package
        run: |
          mkdir -p out
          cp libs/${{ matrix.abi }}/libretro.so out/puae_libretro_android.so
          cp obj/local/${{ matrix.abi }}/libretro.so out/puae_libretro_android.debug.so   # symbols, for crash offsets
          cd out
          zip -9 puae_libretro_android.so.zip puae_libretro_android.so
          zip -9 puae_libretro_android.debug.so.zip puae_libretro_android.debug.so && rm puae_libretro_android.debug.so
          sha256sum puae_libretro_android.so* > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: puae_libretro_android-${{ matrix.abi }}
          path: out/*

      - uses: actions/upload-artifact@v4
        if: matrix.abi == 'armeabi-v7a'
        with:
          name: jit-generated-tables
          path: |
            sources/src/jit/compemu.c
            sources/src/jit/compstbl.c

  # Every successful build is published as a GitHub release:
  #  - tags v*: a normal release with that tag;
  #  - branches: a rolling pre-release "build-<branch>", replaced by each new successful build.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Rename per ABI
        run: |
          for d in dist/puae_libretro_android-*/; do
            abi=$(basename "$d" | sed 's/puae_libretro_android-//')
            mv "$d/puae_libretro_android.so.zip" "dist/puae_libretro_android-$abi.so.zip"
            [ -f "$d/jit-runner" ] && mv "$d/jit-runner" "dist/jit-runner-$abi"
            [ -f "$d/simpleperf" ] && mv "$d/simpleperf" "dist/simpleperf-$abi"
            mv "$d/puae_libretro_android.debug.so.zip" "dist/puae_libretro_android-$abi.debug.so.zip"
          done
          ls -la dist
      - name: Publish release
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            gh release create "$GITHUB_REF_NAME" dist/*.zip dist/jit-runner-* dist/simpleperf-* --title "$GITHUB_REF_NAME" --generate-notes
          else
            tag="build-$(echo "$GITHUB_REF_NAME" | tr '/' '-')"
            gh release delete "$tag" --yes --cleanup-tag || true
            gh release create "$tag" dist/*.zip dist/jit-runner-* dist/simpleperf-* --prerelease --target "$GITHUB_SHA" \
              --title "$GITHUB_REF_NAME build $(echo "$GITHUB_SHA" | cut -c1-7)" \
              --notes "Automatic build of $GITHUB_REF_NAME at $GITHUB_SHA."
          fi
