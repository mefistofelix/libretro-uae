name: ARM JIT test

# Runs the 32-bit ARM JIT without any device: PUAE is built for Linux armhf with ARM_JIT=1 and
# driven by a headless libretro frontend (.github/scripts/jit-runner.c) under qemu-arm.
# The same A1200 boot (built-in AROS ROM, no copyrighted files) runs with the JIT off and on;
# the job fails if the JIT run resets or traps differently from the interpreter.

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      frames:
        description: "Frames to emulate"
        default: "500"

concurrency:
  group: jit-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qemu:
    runs-on: ubuntu-latest
    env:
      FRAMES: ${{ inputs.frames || '500' }}
      QEMU_LD_PREFIX: /usr/arm-linux-gnueabihf
    steps:
      - uses: actions/checkout@v4

      - name: Install cross toolchain and qemu
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf qemu-user >/dev/null

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: armhf-jit
          max-size: 500M

      - name: Generate ARM JIT tables
        run: sh .github/scripts/gen-arm-jit.sh

      - name: Build PUAE (armhf, ARM JIT)
        run: |
          make -j"$(nproc)" platform=unix-armv7-hardfloat-neon ARM_JIT=1 \
            CC="ccache arm-linux-gnueabihf-gcc" CXX="ccache arm-linux-gnueabihf-g++" \
            CFLAGS="-w" CXXFLAGS="-w" SILENT=1 2>&1 | grep -E "error|Error|undefined" || true
          ls -la puae_libretro.so

      - name: Build test frontend
        run: |
          arm-linux-gnueabihf-gcc -O2 -w -Ilibretro-common/include \
            .github/scripts/jit-runner.c -ldl -o jit-runner

      - name: Run interpreter and JIT
        run: |
          set +e
          common="puae_model=A1200 puae_kickstart=aros puae_cpu_compatibility=normal quiet=1"
          mkdir -p out/nojit out/jit
          (cd out/nojit && timeout 1200 qemu-arm ../../jit-runner ../../puae_libretro.so "$FRAMES" - \
            $common puae_cpu_jit=disabled > log.txt 2>&1; echo "exit $?" >> log.txt)
          (cd out/jit && timeout 1200 qemu-arm ../../jit-runner ../../puae_libretro.so "$FRAMES" - \
            $common puae_cpu_jit=8192 > log.txt 2>&1; echo "exit $?" >> log.txt)
          for m in nojit jit; do
            echo "=== $m"; grep -E "RESULT|exit|JIT:|Trap|Illegal" out/$m/log.txt | head -30
          done
          {
            echo "### ARM JIT test ($FRAMES frames, AROS, A1200)"
            echo '```'
            grep -h RESULT out/nojit/log.txt | sed 's/^/interpreter: /'
            grep -h RESULT out/jit/log.txt | sed 's/^/jit:         /'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jit-test
          path: out/

      - name: Compare
        run: |
          r() { grep -o "$1=[0-9]*" out/$2/log.txt | cut -d= -f2; }
          [ -n "$(r resets jit)" ] || { echo "JIT run did not finish"; exit 1; }
          echo "interpreter: resets=$(r resets nojit) traps=$(r traps nojit)"
          echo "jit:         resets=$(r resets jit) traps=$(r traps jit)"
          [ "$(r resets jit)" = "$(r resets nojit)" ] && [ "$(r traps jit)" = "$(r traps nojit)" ]
